<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizations</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <header class="site-header">
      <div class="container">
        <!-- Initials logo -->
        <h1 class="site-logo">VS</h1>

        <nav aria-label="Primary navigation">
          <ul class="nav-list">
            <li><a aria-current="page" href="index.html">Home</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="visualizations.html">Visualizations</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="container">
        <!-- Visualization 1 -->
        <section aria-labelledby="viz1-title">
          <h2 id="viz1-title">Interactive Tint Preview (VLT%)</h2>
          <p>Select a VLT option to preview how window darkness changes.</p>

          <div class="tint-controls" aria-label="Tint options">
            <button type="button" class="tint-btn" data-vlt="5">5%</button>
            <button type="button" class="tint-btn" data-vlt="20">20%</button>
            <button type="button" class="tint-btn" data-vlt="35">35%</button>
            <button type="button" class="tint-btn" data-vlt="50">50%</button>
          </div>

          <p id="tint-status" class="tint-status">Selected: 20% VLT</p>

          <div id="viz-chart" class="viz-frame"></div>
        </section>

        <!-- Visualization 2 -->
        <section aria-labelledby="viz2-title">
          <h2 id="viz2-title">SVG Art</h2>
          <p>Generative pattern inspired by light and glass. Click to regenerate.</p>

          <button id="regen-art" type="button">Regenerate</button>
          <div id="viz-art" class="viz-frame"></div>
        </section>
      </div>
    </main>

    <script src="vis.js"></script>
  </body>
</html>
